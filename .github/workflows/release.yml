# Releases.
#
# Every push to main that touches the code is a release: the patch version is
# bumped in package.json (which the manifest reads), committed, tagged
# v<version>, built, checked, packed, published as a GitHub release with the
# zip for hand installs, and, when the store secrets are set, uploaded to the
# Chrome Web Store and published after review. The Edge listing is fed from the
# release by its own repository, zoreal-mark-edge. Users receive it on their
# browser's next update check without doing anything.
#
# Two other ways in: run the workflow by hand with a level of minor or major
# for a bigger bump; or push a tag v<version> yourself, which skips the bump
# and must match the manifest version.
#
# A push that only touches documentation or the store listing is not a
# release. The bump commit is pushed with the workflow's own token, which does
# not start workflows, so a release cannot trigger another.
#
# Secrets (repository settings):
#   CWS_EXTENSION_ID   the item id the store assigned at the first, manual upload
#   CWS_CLIENT_ID      an OAuth client (Desktop) in a Google Cloud project with the
#   CWS_CLIENT_SECRET  Chrome Web Store API enabled, owned by the publisher account
#   CWS_REFRESH_TOKEN  a refresh token for that client, obtained once by hand
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'store/**'
      - 'dev/screens/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      level:
        description: Version bump
        type: choice
        default: patch
        options: [patch, minor, major]

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch git dependencies over HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci
      # The lockfile is written on a Mac and carries only that platform's native
      # binding for the bundler; npm does not add another platform's on its own
      # (npm/cli#4828). The runner's binding is added here, at the locked
      # bundler version.
      - run: |
          npm install --no-save --no-audit --no-fund \
            "@rolldown/binding-linux-x64-gnu@$(node -p "JSON.parse(require('fs').readFileSync('node_modules/rolldown/package.json','utf8')).version")" \
            "lightningcss-linux-x64-gnu@$(node -p "JSON.parse(require('fs').readFileSync('node_modules/lightningcss/package.json','utf8')).version")"
      - name: Bump the version, commit and tag
        # A branch push bumps the patch level; a run by hand bumps the level
        # chosen; a tag push is already the version and bumps nothing.
        if: "!startsWith(github.ref, 'refs/tags/') && !startsWith(github.event.head_commit.message, 'Release v')"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ github.event_name == 'workflow_dispatch' && inputs.level || 'patch' }}" -m "Release v%s"
          git push --follow-tags origin HEAD:main
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The tag names the manifest version
        id: version
        run: |
          v=$(node -p "require('./dist/manifest.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "tag ${GITHUB_REF_NAME} but manifest version $v"; exit 1; fi
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - run: npm run pack
      - name: GitHub release with the package, for manual installs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: release/*.zip
          generate_release_notes: true
          body: |
            To install by hand: download the zip below, unzip it, open chrome://extensions,
            turn on Developer mode, choose "Load unpacked" and pick the unzipped folder.
            A hand-installed copy does not update itself.
      - name: Are the store secrets set
        id: cws
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: echo "present=$([ -n "$CWS_EXTENSION_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Upload to the Chrome Web Store and publish
        if: steps.cws.outputs.present == 'true'
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source release/*.zip \
            --extension-id "$CWS_EXTENSION_ID" \
            --client-id "$CWS_CLIENT_ID" \
            --client-secret "$CWS_CLIENT_SECRET" \
            --refresh-token "$CWS_REFRESH_TOKEN" \
            --auto-publish
